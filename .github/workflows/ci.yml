name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Smoke test (no audio hardware needed)
        run: |
          .build/release/thru --version
          .build/release/thru map-check "3-4:1-2" 8 18
